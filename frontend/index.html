<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AresVision 智绘赤星</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 字体说明：原先引用 Google Fonts，国内直连不通且会阻塞首屏渲染（页面一直转圈）。
         现改为使用 src/index.css 中已定义的系统字体兜底链：
           --font-display: 'Sora','Space Grotesk','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif
           --font-body:    'Space Grotesk','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif
         如需恢复品牌字体，请自托管：下载 woff2 放到 public/fonts/ 并改用 @font-face 本地引用。 -->
  </head>
  <body>
    <script>
      if (typeof window.global === 'undefined') {
        window.global = window;
      }
      // 在 React 挂载前立即应用已保存的主题，避免深→浅闪烁
      try {
        var _s = JSON.parse(localStorage.getItem('aresvision_settings'));
        if (_s && _s.theme) {
          document.documentElement.setAttribute('data-theme', _s.theme);
        }
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
